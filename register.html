<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration - Management Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .event-info {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #2a5298;
            display: none;
        }

        .event-info h3 {
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .event-info p {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        .form-group.required label::after {
            content: " *";
            color: #dc3545;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(30, 60, 114, 0.4);
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            display: none;
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #0099cc;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            color: #333;
            font-size: 0.95em;
        }

        .ticket-info {
            background: #fff9e6;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            color: #333;
            display: none;
        }

        .ticket-info h4 {
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .ticket-code {
            background: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-weight: bold;
            text-align: center;
            color: #333;
            border: 1px solid #ddd;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Event Registration</h1>
        <p class="subtitle">Register for approved college events</p>

        <div class="success-message" id="successMessage">
            Registration successful! Your ticket ID has been generated.
        </div>

        <div class="error-message" id="errorMessage"></div>

        <!-- Event Selection -->
        <div class="form-group required">
            <label>Select Event</label>
            <select id="eventSelect" onchange="updateEventInfo()">
                <option value="">-- Choose an event --</option>
            </select>
        </div>

        <!-- Event Info Display -->
        <div class="event-info" id="eventInfoBox">
            <h3 id="eventName"></h3>
            <p><strong>Date:</strong> <span id="eventDate"></span></p>
            <p><strong>Venue:</strong> <span id="eventVenue"></span></p>
            <p><strong>Capacity:</strong> <span id="eventCapacity"></span></p>
            <p><strong>Organization:</strong> <span id="eventOrganization"></span></p>
        </div>

        <form id="registrationForm" onsubmit="handleSubmit(event)">
            <!-- ERP ID -->
            <div class="form-group required">
                <label>ERP ID</label>
                <input 
                    type="text" 
                    id="erpId" 
                    placeholder="Enter your ERP ID"
                    required
                >
            </div>

            <!-- Student Name -->
            <div class="form-group required">
                <label>Full Name</label>
                <input 
                    type="text" 
                    id="studentName" 
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group required">
                <label>Email Address</label>
                <input 
                    type="email" 
                    id="studentEmail" 
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Phone -->
            <div class="form-group required">
                <label>Phone Number</label>
                <input 
                    type="tel" 
                    id="studentPhone" 
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <!-- Terms & Conditions -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the terms and conditions</label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Register for Event</button>
        </form>

        <!-- Ticket Display -->
        <div class="ticket-info" id="ticketInfo">
            <h4>Registration Confirmed</h4>
            <p>Your ticket ID:</p>
            <div class="ticket-code" id="ticketCode"></div>
            <p style="margin-top: 10px; font-size: 0.9em; color: #666;">Please save this ticket for event check-in.</p>
        </div>

        <div class="info-box">
            Only approved events are available for registration.
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'eventManagementData';

        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : { events: [], registrations: [] };
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function populateEvents() {
            const data = loadData();
            const approvedEvents = data.events.filter(e => e.status === 'APPROVED');
            const select = document.getElementById('eventSelect');
            
            approvedEvents.forEach(event => {
                const option = document.createElement('option');
                option.value = event.id;
                option.textContent = event.title;
                select.appendChild(option);
            });

            if (approvedEvents.length === 0) {
                select.innerHTML = '<option value="">No approved events available</option>';
            }
        }

        function updateEventInfo() {
            const data = loadData();
            const select = document.getElementById('eventSelect');
            const selectedId = parseInt(select.value);
            const event = data.events.find(e => e.id === selectedId);

            const eventBox = document.getElementById('eventInfoBox');

            if (event) {
                document.getElementById('eventName').textContent = event.title;
                document.getElementById('eventDate').textContent = new Date(event.date).toLocaleDateString();
                document.getElementById('eventVenue').textContent = event.venue;
                document.getElementById('eventCapacity').textContent = event.capacity + ' people';
                document.getElementById('eventOrganization').textContent = event.organization;
                eventBox.style.display = 'block';
            } else {
                eventBox.style.display = 'none';
            }
        }

        function generateTicketId() {
            return 'TICKET-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        }

        function handleSubmit(event) {
            event.preventDefault();

            const data = loadData();
            const eventSelect = document.getElementById('eventSelect');
            const selectedEventId = parseInt(eventSelect.value);

            if (!selectedEventId) {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = 'Please select an event';
                return;
            }

            const selectedEvent = data.events.find(e => e.id === selectedEventId);
            const erpId = document.getElementById('erpId').value;
            const studentName = document.getElementById('studentName').value;
            const studentEmail = document.getElementById('studentEmail').value;
            const studentPhone = document.getElementById('studentPhone').value;

            // Check for duplicate registration
            const existingReg = data.registrations.find(
                r => r.eventId === selectedEventId && r.studentEmail === studentEmail
            );

            if (existingReg) {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = 'You are already registered for this event';
                return;
            }

            // Add registration
            const ticketId = generateTicketId();
            data.registrations.push({
                id: Date.now(),
                eventId: selectedEventId,
                erpId: erpId,
                studentName: studentName,
                studentEmail: studentEmail,
                studentPhone: studentPhone,
                ticketId: ticketId,
                registrationDate: new Date().toLocaleString()
            });

            saveData(data);

            // Show success
            document.getElementById('registrationForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('ticketInfo').style.display = 'block';
            document.getElementById('ticketCode').textContent = ticketId;

            setTimeout(() => {
                document.getElementById('ticketInfo').scrollIntoView({ behavior: 'smooth' });
            }, 500);
        }

        window.onload = function() {
            populateEvents();
        };
    </script>
</body>
</html>
