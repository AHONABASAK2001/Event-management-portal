<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club/Committee Login - Event Management Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 50px;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(30, 60, 114, 0.4);
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #0099cc;
            padding: 15px;
            border-radius: 5px;
            margin-top: 25px;
            color: #333;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .info-box h4 {
            color: #0099cc;
            margin-bottom: 10px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0099cc;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Club & Committee Portal</h1>
        <p class="subtitle">Login to manage your events and submissions</p>

        <div class="error-message" id="errorMsg"></div>
        <div class="success-message" id="successMsg"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Select Your Committee & Club</label>
                <select id="organization" required>
                    <option value="">-- Choose Committee or Club --</option>
                    <optgroup label="Committees (6)">
                        <option value="Athflex">Athflex - athflex@imthyderabad.edu.in</option>
                        <option value="Mezzo">Mezzo - mezzo@imthyderabad.edu.in</option>
                        <option value="TedEx">TedEx - tedximth@imthyderabad.edu.in</option>
                        <option value="ARC">ARC - alumnicommittee@imthyderabad.edu.in</option>
                        <option value="IRC">IRC - stud.irc@imthyderabad.edu.in</option>
                        <option value="MRC">MRC - mrc@imthyderabad.edu.in</option>
                    </optgroup>
                    <optgroup label="Clubs (12)">
                        <option value="Finacea">Finacea - finacea@imthyderabad.edu.in</option>
                        <option value="Tassavur">Tassavur - tassavur@imthyderabad.edu.in</option>
                        <option value="Mercatus">Mercatus - mercatusmantra@imthyderabad.edu.in</option>
                        <option value="Opuskriya">Opuskriya - opuskriya@imthyderabad.edu.in</option>
                        <option value="Insightx">Insightx - insightix@imthyderabad.edu.in</option>
                        <option value="Synergy">Synergy - synergy@imthyderabad.edu.in</option>
                        <option value="CommWing">CommWing - commwing@imthyderabad.edu.in</option>
                        <option value="Athena">Athena - athena@imthyderabad.edu.in</option>
                        <option value="Altius">Altius - altius@imthyderabad.edu.in</option>
                        <option value="Pahel">Pahel - pahel@imthyderabad.edu.in</option>
                        <option value="Antragna">Antragna - antragna@imthyderabad.edu.in</option>
                        <option value="Prarambh">Prarambh - prarambh.ecell@imthyderabad.edu.in</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="coordinator@college.edu" required>
            </div>

            <div class="form-group">
                <label>Coordinator Name</label>
                <input type="text" id="coordinatorName" placeholder="Your full name" required>
            </div>

            <button type="submit" class="btn-login">Login to Dashboard</button>
        </form>

        <div class="info-box">
            <h4>Demo Login Credentials</h4>
            <p><strong>Organization:</strong> Any from the list</p>
            <p><strong>Email:</strong> Use any email address</p>
            <p><strong>Name:</strong> Your name or any name</p>
            <p style="margin-top: 10px; font-size: 0.85em; color: #666;">First-time users are automatically registered</p>
        </div>

        <a href="index.html" class="back-link">Back to Home</a>
    </div>

    <script>
        const CLUB_LOGIN_KEY = 'clubLoginData';
        const CURRENT_USER_KEY = 'currentClubUser';

        function handleLogin(event) {
            event.preventDefault();

            const org = document.getElementById('organization').value;
            const email = document.getElementById('email').value;
            const name = document.getElementById('coordinatorName').value;

            if (!org || !email || !name) {
                showError('Please fill in all fields');
                return;
            }

            // Store login data
            const userData = {
                organization: org,
                email: email,
                name: name,
                loginTime: new Date().toLocaleString()
            };

            localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(userData));

            // Show success message
            showSuccess('Login successful! Redirecting...');
            
            setTimeout(() => {
                window.location.href = 'club-dashboard.html';
            }, 1500);
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        function showSuccess(message) {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = message;
            successMsg.style.display = 'block';
        }
    </script>
</body>
</html>
